spring:
  cloud:
    loadbalancer:
      ribbon:
        enabled: false

sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out_report
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:replace_me}
  alioss:
    bucket-name: wudixiaoxuesheng-ai
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:replace_me}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:replace_me}
    endpoint: oss-cn-beijing.aliyuncs.com
  redis:
    host: localhost
    port: 6379
    database: 11
  wechat:
    # 后续请将 appid、secret、mchid、证书路径等替换为你自己的配置
    appid: ${WECHAT_APPID:replace_me}
    secret: ${WECHAT_SECRET:replace_me}
    mchid : ${WECHAT_MCHID:replace_me}
    mchSerialNo: ${WECHAT_MCH_SERIAL_NO:replace_me}
    privateKeyFilePath: ${WECHAT_PRIVATE_KEY_FILE_PATH:D:/apiclient_key.pem}
    apiV3Key: ${WECHAT_API_V3_KEY:replace_me}
    weChatPayCertFilePath: ${WECHAT_PAY_CERT_FILE_PATH:D:/wechatpay_cert.pem}
    notifyUrl: https://www.weixin.qq.com/wxpay/pay.php
    refundNotifyUrl: https://www.weixin.qq.com/wxpay/pay.php



